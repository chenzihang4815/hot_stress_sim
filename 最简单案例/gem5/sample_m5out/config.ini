; Minimal fake gem5 config.ini — shows the object tree, not a real run.

[root]
type=Root

[system]
type=System
mem_mode=timing
cache_line_size=64

[system.cpu]
type=TimingSimpleCPU
clk_domain=system.clk_domain
numThreads=1

[system.cpu.icache]
type=Cache
size=32kB
assoc=2

[system.cpu.dcache]
type=Cache
size=32kB
assoc=2

[system.l2]
type=Cache
size=1MB
assoc=8

[system.mem_ctrl]
type=MemCtrl
